name: CI

on:
  pull_request:
    branches: [main]
  # เลขซ้ำเกิดจาก "สอง PR ที่ผ่านทีละใบแล้วมาชนกันตอนอยู่บน main" — ด่านที่รันเฉพาะ
  # ตอน pull_request จึงมองไม่เห็นตลอดกาล (0169 ซ้ำ แล้ว 0170 ซ้ำต่อทันที)
  push:
    branches: [main]

# ── PR ยกเลิกของเก่าได้ · main ห้ามยกเลิกกันเอง ────────────────────────────
# 🐞 **ของเดิมใช้กลุ่มเดียวกันทั้งสองทาง** (`github.ref` = `refs/heads/main` ทุก push)
# คู่กับ `cancel-in-progress: true` ⇒ merge สองใบติดกัน **ใบแรกโดนยกเลิกกลางคัน**
# แล้ว run ของ commit นั้นค้างเป็น `cancelled` ตลอดไป
#
# ⚠️ ไม่ใช่แค่ตัวเลขบนหน้า Actions — `deploy-production.yml` อ่าน **ผลของ `ci`
# ที่ SHA นั้นตรง ๆ** เป็นด่านก่อน deploy (ดูคอมเมนต์ในไฟล์นั้น) ⇒ commit ที่ถูก
# ยกเลิกจะ deploy ไม่ได้ตลอดกาล ทั้งที่โค้ดไม่ได้พังอะไรเลย · วันที่มีหลายสายทำงาน
# พร้อมกัน merge ถี่ ๆ จึงทำให้ production ตันเองเงียบ ๆ
#
# main = กลุ่มต่อ commit (`github.sha`) ⇒ ทุก commit ได้ผลของตัวเองเสมอ ไม่มีใครไปยกเลิก
# PR   = กลุ่มต่อ PR + ยกเลิกของเก่าได้ตามเดิม (push รัว ๆ เอาเฉพาะครั้งล่าสุดก็พอ)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: webapp

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ── ด่านที่ต้องคุยกับฐานจริง (check:columns · check:refs) ───────────────
    # สองด่านนี้เทียบโค้ดกับ **schema จริงบน Supabase** จึงต้องมีคีย์ · ถ้าไม่ตั้ง
    # secret ไว้ ทั้งคู่จะถูก **ข้าม** (ขึ้นสีเทาในหน้า run + มี warning) ไม่ใช่เขียว
    # เงียบ ๆ — ด่านที่ผ่านโดยไม่ได้ตรวจอะไรเลย อันตรายกว่าไม่มีด่าน
    #
    # ⚠️ ต้องใช้ **service-role key** — anon key อ่าน schema (`/rest/v1/`) ไม่ได้
    # (ตอบ 401) และอ่านตารางได้ 0 แถวเพราะ RLS ⇒ ใช้แทนกันไม่ได้ · การเก็บ
    # service-role ไว้ใน GitHub secrets = ทุก workflow run มีสิทธิ์เขียน production
    # ⇒ **เป็นการตัดสินใจของเจ้าของรีโป ไม่ใช่ของ CI** จึงปล่อยให้ข้ามได้ตามค่าตั้งต้น
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ต้อง >= 21: npm test ใช้ glob ใน `node --test "src/**/*.test.mjs"`
          # ซึ่ง Node 20 ยังไม่รองรับ (หาไฟล์ไม่เจอ) — ใช้ 22 LTS ตรงกับ Vercel
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # eslint exits non-zero on errors only; warnings never fail the build.
      # This is the gate that would have caught react/jsx-no-undef in PR #481/#482.
      - name: Lint (errors only)
        run: npx eslint src

      # เลขไฟล์ migration ห้ามซ้ำ — ถ้าซ้ำ คนรันมือบน Supabase จะข้ามไฟล์ใดไฟล์หนึ่งเงียบ ๆ
      # (เคยหลุด 0076/0087/0099 มาแล้ว แล้วหลุดซ้ำ 0169 → 0170 ตอน merge ไล่กัน 2026-07-28)
      - name: Migration integrity
        run: npm run check:migrations

      # ด่านดีไซน์: เพดานชั้นสไตล์เก่าต่อโมดูล (ratchet) + contract ของ primitive กลาง
      # + คลาสที่ไม่มี selector จริงใน globals.css
      #
      # ก่อนหน้านี้ไม่เคยอยู่ใน CI เลย — ratchet จึงเป็นด่านที่ต้องมีคนเดินไปกดเอง
      # PR #778 เลยผ่านฉลุยทั้งที่ดันเพดานเกินทั้ง 4 ตัว แล้ว main ค้างแดงอยู่หลายวัน
      # โดยไม่มีอะไรเตือน (ตามเก็บที่ #785)
      - name: UI audit
        run: npm run audit:ui

      # ด่านเพดาน 1,000 แถวของ PostgREST (ratchet) — `.select()` ที่ไม่มี range/limit
      # ได้คืนมาแค่ 1,000 แถวแรก **โดยไม่มี error** โค้ดจึงเดินต่อด้วยข้อมูลไม่ครบ
      #
      # ประวัติเดียวกับ UI audit เป๊ะ: ด่านนี้มีมาตั้งแต่ 2026-08-16 แต่ไม่เคยอยู่ใน CI
      # ⇒ ต้องมีคนเดินไปกดเอง · พอไม่มีใครกด ratchet ก็ลอยขึ้นเงียบ ๆ แล้ว main
      # ค้างแดงอยู่หลายวันโดยไม่มีอะไรเตือน (ตรวจพบ 2026-08-25)
      - name: Row cap ratchet
        run: npm run check:rowcap

      # ด่านกัน "วันแบบ UTC" (ratchet) — ไทยเร็วกว่า UTC 7 ชม. ⇒ โค้ดที่ตัดวันจาก
      # `toISOString()` จะได้วันย้อนหลังหนึ่งวันทุกคืนระหว่างเที่ยงคืนถึง 7 โมงเช้า
      # ไม่ใช่แค่การแสดงผล: เดือน Actual · SLA · ตีกลับอัตโนมัติ · อายุราคา คิดจาก "วันนี้"
      # บั๊กแบบนี้หายเองตอนสาย จึงหาสาเหตุยากมากถ้าไม่มีด่านจับตั้งแต่ตอนเขียน
      - name: Thai-time ratchet
        run: npm run check:thaitime

      # คอลัมน์ที่ `.select()` อ้างถึงต้องมีอยู่จริงบนฐาน — คอลัมน์ที่พิมพ์ผิด/ถูกลบ
      # ทำให้ PostgREST ตอบ 500 ทั้งเส้น และ JS ไม่มีทางจับได้ตอน build
      - name: Schema drift (select columns)
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run check:columns

      # ทะเบียนอ้างอิง (หมวด/หน่วย/สถานะ) ที่โค้ดใช้ ต้องตรงกับแถวจริงบนฐาน
      - name: Reference tables
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run check:refs

      # ทะเบียนทีม (mig 0310/0311) ต้องตรงกับค่าคงที่ TEAMS ในโค้ด — ทีมขายมีสองที่
      # โดยเจตนา (ด่านสิทธิ์อ่านแบบ sync จากฐานไม่ได้) ด่านนี้กันไม่ให้สองฝั่งเพี้ยน
      - name: Team registry
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: npm run check:teams

      # ⚠️ ไม่มี secret = สามด่านบนถูกข้าม · ต้องส่งเสียงให้เห็นในหน้า run ไม่ใช่
      # ปล่อยให้ทั้ง job เขียวแล้วเข้าใจว่าตรวจครบ
      - name: เตือนเมื่อด่านที่ต้องใช้ฐานข้อมูลถูกข้าม
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: |
          echo "::warning title=ด่าน schema ถูกข้าม::check:columns · check:refs · check:teams ไม่ได้รัน เพราะยังไม่ได้ตั้ง secret SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY — คอลัมน์ที่พิมพ์ผิดหรือถูกลบจะหลุดขึ้น production ได้"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
