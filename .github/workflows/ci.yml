name: CI

on:
  pull_request:
    branches: [main]
  # เลขซ้ำเกิดจาก "สอง PR ที่ผ่านทีละใบแล้วมาชนกันตอนอยู่บน main" — ด่านที่รันเฉพาะ
  # ตอน pull_request จึงมองไม่เห็นตลอดกาล (0169 ซ้ำ แล้ว 0170 ซ้ำต่อทันที)
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: webapp

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ต้อง >= 21: npm test ใช้ glob ใน `node --test "src/**/*.test.mjs"`
          # ซึ่ง Node 20 ยังไม่รองรับ (หาไฟล์ไม่เจอ) — ใช้ 22 LTS ตรงกับ Vercel
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # eslint exits non-zero on errors only; warnings never fail the build.
      # This is the gate that would have caught react/jsx-no-undef in PR #481/#482.
      - name: Lint (errors only)
        run: npx eslint src

      # เลขไฟล์ migration ห้ามซ้ำ — ถ้าซ้ำ คนรันมือบน Supabase จะข้ามไฟล์ใดไฟล์หนึ่งเงียบ ๆ
      # (เคยหลุด 0076/0087/0099 มาแล้ว แล้วหลุดซ้ำ 0169 → 0170 ตอน merge ไล่กัน 2026-07-28)
      - name: Migration integrity
        run: npm run check:migrations

      # ด่านดีไซน์: เพดานชั้นสไตล์เก่าต่อโมดูล (ratchet) + contract ของ primitive กลาง
      # + คลาสที่ไม่มี selector จริงใน globals.css
      #
      # ก่อนหน้านี้ไม่เคยอยู่ใน CI เลย — ratchet จึงเป็นด่านที่ต้องมีคนเดินไปกดเอง
      # PR #778 เลยผ่านฉลุยทั้งที่ดันเพดานเกินทั้ง 4 ตัว แล้ว main ค้างแดงอยู่หลายวัน
      # โดยไม่มีอะไรเตือน (ตามเก็บที่ #785)
      - name: UI audit
        run: npm run audit:ui

      # ด่านเพดาน 1,000 แถวของ PostgREST (ratchet) — `.select()` ที่ไม่มี range/limit
      # ได้คืนมาแค่ 1,000 แถวแรก **โดยไม่มี error** โค้ดจึงเดินต่อด้วยข้อมูลไม่ครบ
      #
      # ประวัติเดียวกับ UI audit เป๊ะ: ด่านนี้มีมาตั้งแต่ 2026-08-16 แต่ไม่เคยอยู่ใน CI
      # ⇒ ต้องมีคนเดินไปกดเอง · พอไม่มีใครกด ratchet ก็ลอยขึ้นเงียบ ๆ แล้ว main
      # ค้างแดงอยู่หลายวันโดยไม่มีอะไรเตือน (ตรวจพบ 2026-08-25)
      - name: Row cap ratchet
        run: npm run check:rowcap

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
