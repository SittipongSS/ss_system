name: Deploy to production

# Vercel deploys the `production` branch now, not `main` — see
# webapp/vercel.json → git.deploymentEnabled. `main` still collects every merge
# all day; this workflow fast-forwards `production` to `main` on a schedule so
# ~22 merges a day become 3 production builds instead of 22.
#
# Why this exists: Build CPU Minutes were 87% of the Vercel infrastructure bill
# ($24.22 of a $27.98 subtotal), and Vercel bills allocated vCPU multiplied by
# the wall-clock duration of the entire build step — clone, install, build,
# cache upload. Making the build itself cheaper only moves a slice of that;
# running fewer builds is the lever that actually moves the number.

on:
  schedule:
    # Times are UTC. 02:00 / 06:00 / 11:00 UTC = 09:00 / 13:00 / 18:00 in
    # Thailand (ICT, UTC+7). Thailand has no daylight saving, so these stay
    # correct year-round and never need a seasonal adjustment.
    - cron: '0 2,6,11 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    # 5 นาทีพอสำหรับแค่ push — แต่ขั้นตรวจปลายทางต้องรอ Vercel build เสร็จ
    # (วัดจริง ~3–5 นาที) แล้วยังเผื่อคิว build ที่ยาวกว่าปกติ
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward production to main
        id: ff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # How long an undeployed commit may sit behind a non-green CI before
          # a scheduled run stops warning and starts failing. Longer than the
          # widest gap between rounds would never fire; much shorter would fire
          # on healthy overnight waits.
          STUCK_AFTER_HOURS=6

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin +refs/heads/production:refs/remotes/origin/production || true

          main_sha=$(git rev-parse refs/remotes/origin/main)
          if git rev-parse --verify --quiet refs/remotes/origin/production >/dev/null; then
            prod_sha=$(git rev-parse refs/remotes/origin/production)
          else
            prod_sha=""
          fi

          if [ "$prod_sha" = "$main_sha" ]; then
            echo "production is already at $main_sha — nothing new to deploy."
            echo "No new commits since the last deployment." >> "$GITHUB_STEP_SUMMARY"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A scheduled deploy runs with nobody watching, so it must not ship a
          # main whose CI is red or still running. The `ci` workflow runs on
          # every push to main, so its conclusion for this exact SHA is the
          # signal. A missing check run reads as "not green".
          ci_conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${main_sha}/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci")] | first | .conclusion // "pending"' 2>/dev/null || echo "unknown")

          if [ "$ci_conclusion" != "success" ]; then
            message="CI for main ($main_sha) is '$ci_conclusion', not success — refusing to deploy."
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              # Someone pressed the button and is waiting for an answer: fail
              # loudly so they see it rather than assuming the deploy went out.
              echo "::error::$message"
              exit 1
            fi

            # One skip is routine: a merge landed minutes ago and CI is still
            # running. Skipping the *same* commit round after round is not — it
            # means main is red and nothing is reaching production while nobody
            # is being told. A warning alone is invisible, so escalate to a
            # failed run (which GitHub actually notifies about) once the head
            # commit has been stuck for longer than a normal wait.
            #
            # Measured as the age of the undeployed commit rather than a count
            # of consecutive skips, because the gap between rounds is uneven
            # (11:00 UTC to 02:00 UTC is 15 hours) so "two skips" means very
            # different things depending on the time of day. Age measures the
            # thing anyone actually cares about: how long has work been stuck.
            head_epoch=$(git log -1 --format=%ct "$main_sha")
            now_epoch=$(date -u +%s)
            waiting_hours=$(( (now_epoch - head_epoch) / 3600 ))

            if [ "$waiting_hours" -ge "$STUCK_AFTER_HOURS" ]; then
              echo "::error::$message Undeployed for ${waiting_hours}h, past the ${STUCK_AFTER_HOURS}h threshold — production is stuck behind main. Fix CI on main, then deploy."
              {
                echo "## Production is stuck"
                echo
                echo "\`$main_sha\` has been undeployed for **${waiting_hours}h** and its \`ci\` check is \`$ci_conclusion\`."
                echo
                echo "Nothing has reached production since then. Fix CI on main, then run this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "::warning::$message Undeployed for ${waiting_hours}h; waiting for the next scheduled round."
            echo "$message Undeployed for ${waiting_hours}h — will retry next round." >> "$GITHUB_STEP_SUMMARY"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `git push` without --force already refuses a non-fast-forward, but
          # checking first turns a confusing push rejection into a clear reason.
          if [ -n "$prod_sha" ] && ! git merge-base --is-ancestor "$prod_sha" "$main_sha"; then
            echo "::error::production ($prod_sha) is not an ancestor of main ($main_sha). Someone pushed to production directly, or main was rewritten. Resolve by hand — this workflow will not force-push."
            exit 1
          fi

          {
            echo "## Deploying to production"
            echo
            echo "\`$main_sha\`"
            echo
            if [ -n "$prod_sha" ]; then
              count=$(git rev-list --count "$prod_sha..$main_sha")
              echo "$count commit(s) since the last deployment:"
              echo
              git log --no-merges --pretty='- %s' "$prod_sha..$main_sha"
            else
              echo "First deployment from this branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          git push origin "$main_sha:refs/heads/production"
          echo "production -> $main_sha. Vercel builds from here."
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$main_sha" >> "$GITHUB_OUTPUT"

      # ── ถามเว็บจริงว่ารันคอมมิตไหน ────────────────────────────────────────
      #
      # Why this exists: pushing `production` and seeing Vercel report a
      # successful build proves neither that the build shipped nor that what it
      # shipped matches the source. While the turbopack build cache was on
      # (2026-08-20 19:22 → 2026-08-21 19:10) every deploy reported success
      # while serving stale CSS: users said "my change never went live" and
      # every dashboard on our side was green. GitHub's deployment record
      # cannot see that — only the running site can answer it.
      #
      # `/api/version` returns the commit the deployment was built from
      # (VERCEL_GIT_COMMIT_SHA). The alias keeps serving the previous build
      # until Vercel cuts over, so the old SHA here means "still building",
      # not "broken" — poll until it flips, then fail loudly if it never does.
      - name: Verify production is serving the deployed commit
        if: steps.ff.outputs.deployed == 'true'
        env:
          # โดเมนของ production — ตั้งเป็น repo variable ทับได้ถ้าย้ายโดเมน
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://ss-team.vercel.app' }}
          EXPECTED_SHA: ${{ steps.ff.outputs.sha }}
        run: |
          set -euo pipefail

          # เผื่อเวลาให้ยาวกว่า build ที่ช้าที่สุดที่เคยวัดได้ (~5 นาที) พอสมควร
          # แต่ยังสั้นกว่า timeout ของ job เพื่อให้ข้อความของเราได้ขึ้นก่อนโดนตัด
          DEADLINE=$(( $(date -u +%s) + 840 ))
          live=""

          while :; do
            live=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "${PRODUCTION_URL}/api/version" 2>/dev/null | jq -r '.sha // empty' || true)

            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "production is serving $EXPECTED_SHA."
              {
                echo "## Verified live"
                echo
                echo "\`${PRODUCTION_URL}/api/version\` reports \`$EXPECTED_SHA\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$(date -u +%s)" -ge "$DEADLINE" ]; then
              # ว่าง = เส้นนั้นตอบไม่ได้เลย (deployment เก่ายังไม่มี route นี้ · โดเมน
              # เปลี่ยน · เว็บล่ม) — ต่างจากตอบมาแต่เป็นคอมมิตอื่น ซึ่งแปลว่า cutover
              # ไม่เกิดขึ้น หรือ Vercel เสิร์ฟ build เก่าอยู่
              reported="${live:-(ไม่ตอบ)}"
              echo "::error::production ยังไม่เสิร์ฟ $EXPECTED_SHA หลังรอ 14 นาที — ตอบกลับมาเป็น $reported"
              {
                echo "## Deploy did not reach production"
                echo
                echo "pushed \`$EXPECTED_SHA\` แต่ \`${PRODUCTION_URL}/api/version\` ยังตอบ \`$reported\`"
                echo
                echo "เช็ค build ล่าสุดบน Vercel ว่าล้มหรือค้าง แล้ว deploy ซ้ำ"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "ยังไม่ cutover (ตอบ ${live:-'(ไม่ตอบ)'}) — รออีก 20 วินาที"
            sleep 20
          done
